name: Build PHARMA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: |
          nuget restore PHARMA.sln -PackagesDirectory packages
          dir packages

    - name: Build Solution (Release)
      run: |
          msbuild PHARMA.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false /v:minimal /nologo

    - name: Collect artifacts
      run: |
          mkdir artifacts
          if exist "PHARMA.UI\bin\Release\PHARMA.exe" (
            xcopy /Y "PHARMA.UI\bin\Release\*.exe" "artifacts\"
            xcopy /Y "PHARMA.UI\bin\Release\*.dll" "artifacts\"
            xcopy /Y "PHARMA.UI\bin\Release\*.config" "artifacts\"
          ) else (
            echo PHARMA.exe not found - listing bin folders
            dir /s PHARMA.UI\bin
            exit /b 1
          )
          dir artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PHARMA-Release
        path: artifacts/
        retention-days: 30
        if-no-files-found: error
