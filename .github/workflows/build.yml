name: Build PHARMA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Build
      run: dotnet build PHARMA.sln -c Release -v minimal

    - name: Collect artifacts
      shell: cmd
      run: |
          mkdir artifacts
          copy /Y PHARMA.UI\bin\Release\net48\PHARMA.exe artifacts\
          copy /Y PHARMA.UI\bin\Release\net48\*.dll artifacts\
          if exist PHARMA.UI\bin\Release\net48\PHARMA.exe.config copy /Y PHARMA.UI\bin\Release\net48\PHARMA.exe.config artifacts\
          if exist PHARMA.UI\bin\Release\net48\App.config copy /Y PHARMA.UI\bin\Release\net48\App.config artifacts\PHARMA.exe.config
          dir artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PHARMA-Release
        path: artifacts/
        retention-days: 30
        if-no-files-found: error
