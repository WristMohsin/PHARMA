name: Build PHARMA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (Release)
      run: msbuild PHARMA.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /v:normal /nologo

    - name: Collect artifacts
      shell: cmd
      run: |
          mkdir artifacts 2>nul
          if exist PHARMA.UI\bin\Release\PHARMA.exe (
            copy /Y PHARMA.UI\bin\Release\*.exe artifacts\
            copy /Y PHARMA.UI\bin\Release\*.dll artifacts\
            if exist PHARMA.UI\bin\Release\*.config copy /Y PHARMA.UI\bin\Release\*.config artifacts\
            echo === ARTIFACTS ===
            dir artifacts
          ) else (
            echo ERROR: PHARMA.exe not found
            dir /s /b *.exe 2>nul
            dir /s /b PHARMA.UI\bin 2>nul
            exit /b 1
          )

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PHARMA-Release
        path: artifacts/
        retention-days: 30
        if-no-files-found: error
